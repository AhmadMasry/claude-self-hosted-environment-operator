<svg xmlns="http://www.w3.org/2000/svg" width="1206" height="802" viewBox="0 0 1206 802" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="1206" height="802" rx="10" fill="#1e1e2e"/>
<circle cx="22" cy="20" r="6" fill="#f38ba8"/><circle cx="42" cy="20" r="6" fill="#f9e2af"/><circle cx="62" cy="20" r="6" fill="#a6e3a1"/>
<text x="603.0" y="25" text-anchor="middle" fill="#9399b2" font-size="12">a session on the operator</text>
<text x="18" y="52" fill="#a6e3a1" font-weight="bold" opacity="0" xml:space="preserve">== create the environment (on-demand mode) and wait for it to register with Anthropic<animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="74" fill="#89b4fa" font-weight="bold" opacity="0" xml:space="preserve">$ kubectl apply -f environment.yaml<animate attributeName="opacity" from="0" to="1" begin="0.80s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="96" fill="#cdd6f4" font-weight="normal" opacity="0" xml:space="preserve">claudeenvironment.claude.cloudeng.ps/real created<animate attributeName="opacity" from="0" to="1" begin="1.70s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="118" fill="#89b4fa" font-weight="bold" opacity="0" xml:space="preserve">$ kubectl get -n claude-real-e2e claudeenvironments<animate attributeName="opacity" from="0" to="1" begin="2.15s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="140" fill="#cdd6f4" font-weight="normal" opacity="0" xml:space="preserve">NAME  MODE      READY  REPLICAS  AGE<animate attributeName="opacity" from="0" to="1" begin="3.05s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="162" fill="#cdd6f4" font-weight="normal" opacity="0" xml:space="preserve">real  onDemand  True             15s<animate attributeName="opacity" from="0" to="1" begin="3.50s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="184" fill="#a6e3a1" font-weight="bold" opacity="0" xml:space="preserve">== start a session on it, from claude.ai or the CLI<animate attributeName="opacity" from="0" to="1" begin="3.95s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="206" fill="#89b4fa" font-weight="bold" opacity="0" xml:space="preserve">$ claude -p "Reply with exactly the text: operator-real-e2e-1791997021" \<animate attributeName="opacity" from="0" to="1" begin="4.75s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="228" fill="#cdd6f4" font-weight="normal" opacity="0" xml:space="preserve">    --environment "$CLAUDE_ENVIRONMENT_ID" --ref test/readme-visuals --output-format json<animate attributeName="opacity" from="0" to="1" begin="5.65s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="250" fill="#cdd6f4" font-weight="normal" opacity="0" xml:space="preserve">{"ok":true,"session_id":"session_01WsFME7Xbwnr52yqsBt8VZy","title":"Operator real e2e 1791997021", ...}<animate attributeName="opacity" from="0" to="1" begin="6.10s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="272" fill="#a6e3a1" font-weight="bold" opacity="0" xml:space="preserve">== the orchestrator spawned a runner pod for the session<animate attributeName="opacity" from="0" to="1" begin="6.55s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="294" fill="#89b4fa" font-weight="bold" opacity="0" xml:space="preserve">$ kubectl get -n claude-real-e2e clauderunners,pods -l claude.cloudeng.ps/environment=real<animate attributeName="opacity" from="0" to="1" begin="7.35s" dur="0.05s" fill="freeze"/></text>
