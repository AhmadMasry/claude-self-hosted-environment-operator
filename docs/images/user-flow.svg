<text x="18" y="382" fill="#cdd6f4" font-weight="normal" opacity="0" xml:space="preserve">NAME                                      READY  STATUS   RESTARTS  AGE<animate attributeName="opacity" from="0" to="1" begin="9.60s" dur="0.05s" fill="freeze"/></text>
