<text x="18" y="668" fill="#a6e3a1" font-weight="bold" opacity="0" xml:space="preserve">== two minutes later (runnerTTLSecondsAfterFinished): garbage-collected, only the orchestrator remains<animate attributeName="opacity" from="0" to="1" begin="16.25s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="690" fill="#89b4fa" font-weight="bold" opacity="0" xml:space="preserve">$ kubectl get -n claude-real-e2e clauderunners,pods -l claude.cloudeng.ps/environment=real<animate attributeName="opacity" from="0" to="1" begin="17.05s" dur="0.05s" fill="freeze"/></text>
