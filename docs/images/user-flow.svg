<text x="18" y="624" fill="#cdd6f4" font-weight="normal" opacity="0" xml:space="preserve">pod/real-orchestrator-9cb9c87f7-6q2d5          1/1    Running    0         114s<animate attributeName="opacity" from="0" to="1" begin="15.35s" dur="0.05s" fill="freeze"/></text>
