<text x="18" y="448" fill="#cdd6f4" font-weight="normal" opacity="0" xml:space="preserve">pod/real-orchestrator-9cb9c87f7-krl74          1/1    Running  0         31s<animate attributeName="opacity" from="0" to="1" begin="10.95s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="470" fill="#a6e3a1" font-weight="bold" opacity="0" xml:space="preserve">== the session replied and was released: the runner succeeded<animate attributeName="opacity" from="0" to="1" begin="11.40s" dur="0.05s" fill="freeze"/></text>
<text x="18" y="492" fill="#89b4fa" font-weight="bold" opacity="0" xml:space="preserve">$ kubectl get -n claude-real-e2e clauderunners,pods -l claude.cloudeng.ps/environment=real<animate attributeName="opacity" from="0" to="1" begin="12.20s" dur="0.05s" fill="freeze"/></text>
