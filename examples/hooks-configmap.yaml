apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-hooks
  namespace: claude-runners
data:
  post-session: |
    #!/bin/sh
    # Illustrative post-session hook: push a rescue branch per working tree so
    # uncommitted work survives the runner's workspace teardown. Pushes with
    # whatever git credentials the runner host has; review before production use.
    set -u
    IFS=':'
    g() { git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c commit.gpgsign=false "$@"; }
    for ws in ${CLAUDE_RUNNER_WORKSPACE_PATHS:-}; do
      cd "$ws" 2>/dev/null || continue
      [ -z "$(g status --porcelain 2>/dev/null)" ] && continue
      g add -A
      g commit -q -m "runner snapshot: ${CLAUDE_RUNNER_SESSION_ID:-unknown} (${CLAUDE_RUNNER_EXIT_REASON:-unknown})" || continue
      g push -q origin "HEAD:refs/heads/rescue/${CLAUDE_RUNNER_SESSION_ID:-unknown}" || true
    done
