name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check the hook copy
        run: hack/check-hook-copy.sh

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Chart lint and contract test
        run: make helm-lint test-chart

  race:
    permissions:
      contents: read
    name: race
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Unit and envtest suites under -race
        run: |
          make manifests generate setup-envtest
          K8S_VERSION="$(make -s print-envtest-version)"
          KUBEBUILDER_ASSETS="$("$PWD/bin/setup-envtest" use "$K8S_VERSION" --bin-dir "$PWD/bin" -p path)" \
            go test -race ./internal/... ./cmd/...
