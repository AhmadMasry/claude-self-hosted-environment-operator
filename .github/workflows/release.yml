name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.1.0); used when not running from a tag
        required: true
      dry_run:
        description: Build and verify only; push nothing
        required: false
        default: "true"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # GitHub Release
      packages: write # GHCR image and chart
      id-token: write # keyless cosign
    env:
      IMAGE: ghcr.io/ahmadmasry/claude-self-hosted-environment-operator
      CHART_REPO: oci://ghcr.io/ahmadmasry/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Derive version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            dry=false
          else
            v="${INPUT_VERSION:-0.0.0-dryrun}"; v="${v#v}"
            dry="${INPUT_DRY_RUN:-true}"
            if [[ "$dry" != "true" ]]; then
              echo "::error::Only a vX.Y.Z tag push publishes; a manual dispatch must keep dry_run=true (got dry_run=$dry on $GITHUB_REF)"
              exit 1
            fi
          fi
          if [[ "$v" == *+* ]]; then
            echo "::error::Version '$v': build metadata is not allowed in image tags"
            exit 1
          fi
          semver='^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$v" =~ $semver ]]; then
            echo "::error::Version '$v' is not a semantic version (X.Y.Z[-pre])"
            exit 1
          fi
          floating=false
          if [[ -z "${BASH_REMATCH[4]}" ]]; then
            floating=true
          fi
          {
            echo "version=$v"
            echo "major_minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "floating=$floating"
            echo "dry=$dry"
          } >> "$GITHUB_OUTPUT"

      - name: Compose image tags
        id: tags
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MAJOR_MINOR: ${{ steps.ver.outputs.major_minor }}
          FLOATING: ${{ steps.ver.outputs.floating }}
        run: |
          tags="$IMAGE:v$VERSION"
          if [[ "$FLOATING" == "true" ]]; then
            tags="$tags,$IMAGE:v$MAJOR_MINOR"
          fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"

      - run: make test

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Login to GHCR
        if: steps.ver.outputs.dry == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (multi-arch)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.ver.outputs.dry == 'false' }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          provenance: false

      - name: Sign image
        if: steps.ver.outputs.dry == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: SBOM
        run: syft packages dir:. -o spdx-json > sbom.spdx.json

      - name: Attest SBOM
        if: steps.ver.outputs.dry == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"

      - name: Installer and chart
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          make build-installer IMG="$IMAGE:v$VERSION"
          make helm-chart IMG="$IMAGE:v$VERSION"
          helm package dist/chart --version "$VERSION" --app-version "$VERSION" -d out
          make helm-lint test-chart

      - name: Push chart
        if: steps.ver.outputs.dry == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          helm push "out/claude-selfhosted-operator-$VERSION.tgz" "$CHART_REPO"

      - name: Upload dry-run artifacts
        if: steps.ver.outputs.dry == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: |
            dist/install.yaml
            out/*.tgz
            sbom.spdx.json

      - name: GitHub Release
        if: steps.ver.outputs.dry == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/install.yaml
            out/*.tgz
            sbom.spdx.json
          generate_release_notes: true
