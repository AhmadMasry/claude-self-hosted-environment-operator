{{- if .Values.admissionPolicy.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "claude-selfhosted-operator.resourceName" (dict "suffix" "orchestrator-secrets" "context" $) }}
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace
      + ':') && request.userInfo.username.endsWith('-orchestrator') && request.userInfo.username.size()
      > ('system:serviceaccount:' + request.namespace + ':').size() + '-orchestrator'.size()
    name: orchestrator-service-account
  - expression: authorizer.group('selfhosted.claudecode.dev').resource('claudeenvironments').namespace(request.namespace).name(request.userInfo.username.substring(('system:serviceaccount:'
      + request.namespace + ':').size(), request.userInfo.username.size() - '-orchestrator'.size())).check('get').allowed()
    name: bound-by-the-operator
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - secrets
  validations:
  - expression: '(request.operation == ''DELETE'' ? oldObject : object).metadata.name.endsWith(''-work-order'')
      && (request.operation == ''DELETE'' || (has(object.metadata.labels) && ''selfhosted.claudecode.dev/environment''
      in object.metadata.labels && object.metadata.labels[''selfhosted.claudecode.dev/environment'']
      == variables.env)) && (request.operation == ''CREATE'' || (has(oldObject.metadata.labels)
      && ''selfhosted.claudecode.dev/environment'' in oldObject.metadata.labels &&
      oldObject.metadata.labels[''selfhosted.claudecode.dev/environment''] == variables.env))'
    message: an orchestrator ServiceAccount may only manage its own environment's
      Secrets named *-work-order
    reason: Forbidden
  variables:
  - expression: '''system:serviceaccount:'' + request.namespace + '':'''
    name: prefix
  - expression: 'request.userInfo.username.startsWith(variables.prefix) && request.userInfo.username.endsWith(''-orchestrator'')
      && request.userInfo.username.size() > variables.prefix.size() + ''-orchestrator''.size()
      ? request.userInfo.username.substring(variables.prefix.size(), request.userInfo.username.size()
      - ''-orchestrator''.size()) : '''''
    name: env
{{- end }}
