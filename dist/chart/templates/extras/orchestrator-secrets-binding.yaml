{{- if .Values.admissionPolicy.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "claude-selfhosted-operator.resourceName" (dict "suffix" "orchestrator-secrets" "context" $) }}
spec:
  policyName: {{ include "claude-selfhosted-operator.resourceName" (dict "suffix" "orchestrator-secrets" "context" $) }}
  validationActions:
  - Deny
{{- end }}
