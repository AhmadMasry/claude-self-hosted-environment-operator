apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: runner-metrics
  namespace: system
  labels:
    app.kubernetes.io/name: claude-selfhosted-operator
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/part-of: claude-code-self-hosted-runner
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: 30s
