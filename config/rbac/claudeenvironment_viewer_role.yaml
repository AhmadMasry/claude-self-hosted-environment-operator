# This rule is not used by the project claude-selfhosted-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to selfhosted.claudecode.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: claude-selfhosted-operator
    app.kubernetes.io/managed-by: kustomize
  name: claudeenvironment-viewer-role
rules:
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments/status
  verbs:
  - get
