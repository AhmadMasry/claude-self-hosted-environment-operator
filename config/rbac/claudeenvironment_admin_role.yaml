# This rule is not used by the project claude-selfhosted-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over selfhosted.claudecode.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: claude-selfhosted-operator
    app.kubernetes.io/managed-by: kustomize
  name: claudeenvironment-admin-role
rules:
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments
  verbs:
  - '*'
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments/status
  verbs:
  - get
