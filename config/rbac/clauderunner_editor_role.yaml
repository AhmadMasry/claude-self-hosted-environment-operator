# This rule is not used by the project claude-selfhosted-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the claude.cloudeng.ps.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: claude-selfhosted-operator
    app.kubernetes.io/managed-by: kustomize
  name: clauderunner-editor-role
rules:
- apiGroups:
  - claude.cloudeng.ps
  resources:
  - clauderunners
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - claude.cloudeng.ps
  resources:
  - clauderunners/status
  verbs:
  - get
