---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments/finalizers
  verbs:
  - update
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments/status
  verbs:
  - get
  - patch
  - update
