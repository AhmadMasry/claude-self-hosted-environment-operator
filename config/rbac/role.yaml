---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments
  - clauderunners
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments/finalizers
  - clauderunners/finalizers
  verbs:
  - update
- apiGroups:
  - selfhosted.claudecode.dev
  resources:
  - claudeenvironments/status
  - clauderunners/status
  verbs:
  - get
  - patch
  - update
