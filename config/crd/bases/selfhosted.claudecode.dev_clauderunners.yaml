---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: clauderunners.selfhosted.claudecode.dev
spec:
  group: selfhosted.claudecode.dev
  names:
    kind: ClaudeRunner
    listKind: ClaudeRunnerList
    plural: clauderunners
    shortNames:
    - crun
    singular: clauderunner
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.sessionID
      name: Session
      type: string
    - jsonPath: .status.podName
      name: Pod
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClaudeRunner is one spawned on-demand runner. It is created by the
          spawn-runner hook, never by users.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClaudeRunnerSpec is written once by the spawn-runner hook
              and never changes.
            properties:
              accountID:
                description: AccountID is the tagged account ID of the session creator.
                  Never an email.
                type: string
              attempt:
                description: Attempt is the delivery attempt from CLAUDE_RUNNER_ATTEMPT
                  (0 when unset).
                format: int32
                minimum: 0
                type: integer
              clientPlatform:
                description: ClientPlatform is the client platform from CLAUDE_RUNNER_CLIENT_PLATFORM.
                type: string
              environmentRef:
                description: EnvironmentRef names the on-demand ClaudeEnvironment
                  that controls this runner.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              orderID:
                description: OrderID is the work order ID; the ClaudeRunner and its
                  pod are named after it.
                maxLength: 253
                minLength: 1
                type: string
              primaryRepoURL:
                description: PrimaryRepoURL is the primary repository URL from CLAUDE_RUNNER_PRIMARY_REPO_URL.
                type: string
              sessionID:
                description: SessionID is the session ID from CLAUDE_RUNNER_SESSION_ID.
                type: string
              sessionUUID:
                description: SessionUUID is the session UUID from CLAUDE_RUNNER_SESSION_UUID.
                type: string
              workOrderSecretRef:
                description: WorkOrderSecretRef names the Secret that holds the single-use
                  work-order JWT.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - environmentRef
            - orderID
            - workOrderSecretRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: workOrderSecretRef.name must be <orderID>-work-order
              rule: self.workOrderSecretRef.name == self.orderID + '-work-order'
          status:
            description: ClaudeRunnerStatus is derived from the runner pod.
            properties:
              conditions:
                description: Conditions holds the Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                description: FinishedAt is when the runner reached a terminal phase;
                  the TTL counts from it.
                format: date-time
                type: string
              message:
                description: Message is a redacted, human-readable detail for the
                  current phase.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status was last
                  computed from.
                format: int64
                type: integer
              phase:
                description: 'Phase is the runner''s lifecycle phase: Pending, Running,
                  Succeeded or Failed.'
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              podName:
                description: PodName is the runner pod, set once the pod has been
                  created.
                type: string
              reason:
                description: Reason is a CamelCase reason for the current phase.
                type: string
              startedAt:
                description: StartedAt is when the runner pod started.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
